name: leox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.7.2

dependencies:
  connectivity_plus: ^6.0.5
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  firebase_storage: ^12.0.0
  cloud_firestore: ^5.0.0
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5

  google_fonts: ^6.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sizer: ^3.1.3
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  timeago: ^3.7.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0
  syncfusion_flutter_pdf: ^31.1.19

  http: any
  razorpay_flutter: ^1.4.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/leo_Opus_logo.jpeg"
